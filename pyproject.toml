[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "decapod"
version = "1.0.0"
description = "An autonomous, self-directed AI agent with multi-agent deliberation, durable memory, and hard safety walls."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Danny Wang" }]
keywords = ["ai", "agent", "autonomous", "multi-agent", "llm", "tui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "textual>=0.86",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
    "rich>=13.7",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]
build = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/ThePeeps191/decapod"
Documentation = "https://github.com/ThePeeps191/decapod/tree/main/docs"
Issues = "https://github.com/ThePeeps191/decapod/issues"

[project.scripts]
decapod = "decapod.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decapod"]

[tool.hatch.build.targets.sdist]
include = ["src/decapod", "tests", "docs", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLC0415", "SIM108",
    "RUF001", "RUF002", "RUF003", "RUF012", "PLW0603", "PLW2901", "SIM105", "SIM905", "B904", "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["decapod"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["decapod.domain.*", "decapod.control.*", "decapod.llm.*", "decapod.config.*"]
disallow_untyped_defs = true
